[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["ml/artifacts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF100"]
ignore = [
    "B008",  # FastAPI uses Depends()/Query() in argument defaults by design
    "E501",  # formatter handles line length; long strings/prompts are fine
]

[tool.ruff.lint.isort]
known-first-party = ["app", "ml", "scripts"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore::UserWarning",
]
